# Render blueprint — free tier, database on Supabase.
#
# Render's dashboard → Blueprints → New Blueprint Instance, pointed at this repository.
# Leave "Blueprint Path" empty: this file is at the repository root, which is where
# Render looks by default, and that field is case-sensitive.
#
# The frontend is not here. It is a Next.js app and belongs on Vercel, which is also
# where www.astro-decoded.com is pointed. See docs/GO_LIVE.md.
#
# ---------------------------------------------------------------------------------
# WHY THIS IS ONE SERVICE AND NOT THREE
# ---------------------------------------------------------------------------------
#
# Render's free tier has no background workers and no free PostgreSQL that persists, so
# the blueprint declares neither:
#
#   * No worker service. The API already runs each analysis on its own thread, so the
#     separate worker is an optimisation for scale, not a requirement. Add it when
#     analysis volume starts competing with request handling.
#
#   * No database. Supabase provides PostgreSQL with pgvector on its free tier; you paste
#     its connection string into DATABASE_URL below.
#
#   * No Redis. Without it rate limiting falls back to in-process counters, which is
#     exactly right for one instance — and one instance is all the free tier runs.
#     /api/v1/health reports which backend is in use.
#
# The one thing a free instance does that matters: it is stopped after ~15 minutes with
# no traffic, and the next request waits up to a minute for it to start again. An
# analysis interrupted by that stop is recovered — SWEEP_STALE_JOBS_IN_API is on by
# default and the API sweeps for abandoned work at startup and periodically after.
#
# ---------------------------------------------------------------------------------
# WHAT YOU MUST SET YOURSELF (Render marks each of these "sync: false" and will prompt)
# ---------------------------------------------------------------------------------
#
#   DATABASE_URL        Supabase → Connect → Session pooler. Not the direct connection:
#                       that address is IPv6-only and Render cannot reach it.
#   CORS_ORIGINS        Your Vercel URL, exactly. https://www.astro-decoded.com
#   FRONTEND_BASE_URL   The same value.
#
# And once, against the Supabase database:
#
#   create extension if not exists vector;

services:
  - type: web
    name: starcode-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /api/v1/health/live
    envVars:
      - key: ENVIRONMENT
        value: production

      - key: SECRET_KEY
        generateValue: true # Generated once by Render and kept; never enters git.

      # ---- You paste these three ----
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: FRONTEND_BASE_URL
        sync: false

      # OAUTH_REDIRECT_BASE is deliberately absent.
      #
      # Deriving it from this service resolves to a bare hostname with no scheme, which
      # produces callback URLs that no provider will accept — and it would resolve to the
      # onrender.com name rather than the custom domain the OAuth console was told about.
      # Both failures surface only as redirect_uri_mismatch at sign-in.
      #
      # Set it by hand when you enable Google or GitHub sign-in, to the full public API
      # URL including the scheme: https://api.astro-decoded.com

      # ---- Sized for a free instance ----
      #
      # 512 MB and 0.1 CPU. Two uvicorn workers on that is an OOM loop rather than
      # headroom, and the analysis threads want the memory more than a second worker
      # would.
      - key: WEB_CONCURRENCY
        value: "1"
      # Supabase's free tier caps connections, and the pooler counts every one this
      # process opens. Small and bounded beats a pool that exhausts the plan.
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: DATABASE_MAX_OVERFLOW
        value: "2"

      # ---- AI provider: auto-detect from ANTHROPIC_API_KEY ----
      #
      # "auto" uses the Anthropic provider when ANTHROPIC_API_KEY is set (via the Render
      # dashboard, kept out of git) and falls back to the deterministic offline engine
      # when it isn't — so adding or rotating the key takes effect on the next deploy
      # with no change needed here.
      #
      # Extraction, calendar conversion and the whole astronomy engine are local
      # computation and work fully in either mode. The interpretive sections report
      # themselves as unavailable only when running fully offline.
      - key: AI_PROVIDER
        value: auto

      # Empty, not absent: the app reads this as "no cache configured" and says so once,
      # rather than spending a second failing to reach localhost on first use and logging
      # a warning about a service you deliberately did not run.
      - key: REDIS_URL
        value: ""

      - key: LOG_FORMAT
        value: json
      - key: SEED_ON_START
        value: "true"
