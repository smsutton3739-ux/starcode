name: CI

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "22"

jobs:
  backend:
    name: Backend — lint, types, tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Every module imports from a clean install
        working-directory: backend
        # The runtime dependencies only, in a throwaway environment, with nothing from
        # the dev extras or the runner image to fill a gap. This is what the deployment
        # gets, and it is the check that was missing when a missing `pydantic[email]`
        # built cleanly and then crashed at startup — the error surfaces at import, so
        # importing everything is enough to catch it.
        run: |
          python -m venv /tmp/clean
          /tmp/clean/bin/pip install --quiet --upgrade pip
          /tmp/clean/bin/pip install --quiet .
          /tmp/clean/bin/python - <<'PY'
          import importlib, pkgutil, sys
          import app
          failed = []
          for mod in pkgutil.walk_packages(app.__path__, prefix="app."):
              try:
                  importlib.import_module(mod.name)
              except Exception as exc:
                  failed.append(f"{mod.name}: {type(exc).__name__}: {exc}")
          for line in failed:
              print(f"FAIL {line}", file=sys.stderr)
          sys.exit(1 if failed else 0)
          PY

      - name: Lint
        working-directory: backend
        run: ruff check app tests scripts

      - name: Format check
        working-directory: backend
        run: ruff format --check app tests scripts

      - name: Type check
        working-directory: backend
        # Not blocking: the codebase is typed throughout, but third-party stubs lag and
        # a failing mypy on someone else's release should not stop a deploy.
        run: mypy app || true
        continue-on-error: true

      - name: Tests
        working-directory: backend
        # SQLite and the offline provider, so the suite needs no services and no keys.
        run: pytest --cov=app --cov-report=term-missing --cov-report=xml -q

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage.xml
          retention-days: 7

  migrations:
    name: Migrations apply to a real PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: starcode
          POSTGRES_PASSWORD: starcode
          POSTGRES_DB: starcode_ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U starcode"
          --health-interval 5s --health-timeout 5s --health-retries 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Upgrade to head
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://starcode:starcode@localhost:5432/starcode_ci
          ENVIRONMENT: development
        run: alembic upgrade head

      - name: Seed the corpus
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://starcode:starcode@localhost:5432/starcode_ci
          ENVIRONMENT: development
        run: python -m app.workers.seed_cli

      - name: Downgrade to base and back up
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://starcode:starcode@localhost:5432/starcode_ci
          ENVIRONMENT: development
        # A migration you cannot reverse is a migration you cannot roll back.
        run: |
          alembic downgrade base
          alembic upgrade head

      - name: Assert the schema matches the models
        working-directory: backend
        env:
          DATABASE_URL: postgresql+psycopg://starcode:starcode@localhost:5432/starcode_ci
          ENVIRONMENT: development
        # Catches a model changed without a matching migration, which otherwise only
        # surfaces as a runtime error in production.
        run: |
          alembic check || {
            echo "::error::The models and the migrations disagree. Run: alembic revision --autogenerate"
            exit 1
          }

  frontend:
    name: Frontend — lint, types, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        working-directory: frontend
        run: npm ci

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Type check
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm test

      - name: Build
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          # The build guard rejects a loopback API URL in a production build; CI is the
          # one legitimate case, since the API really is on localhost here.
          NEXT_PUBLIC_ALLOW_LOCALHOST: "true"
          # A placeholder, so /tools renders its embeds and the accessibility suite can
          # check them. Unset, the page correctly shows "not configured" instead and the
          # frames it is meant to be testing do not exist.
          NEXT_PUBLIC_ASTRO_CHARTS_AFF: ci-placeholder
        run: npm run build

  e2e:
    name: End-to-end and accessibility
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend
        working-directory: backend
        run: pip install -e ".[dev]"

      - name: Install frontend
        working-directory: frontend
        run: npm ci

      - name: Install Playwright browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Start the API
        run: |
          ./scripts/e2e-backend.sh &
          for i in $(seq 1 40); do
            curl -fsS http://127.0.0.1:8100/api/v1/health >/dev/null && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:8100/api/v1/health >/dev/null

      - name: Build the web app
        working-directory: frontend
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8100
          # The build guard rejects a loopback API URL in a production build; CI is the
          # one legitimate case, since the API really is on localhost here.
          NEXT_PUBLIC_ALLOW_LOCALHOST: "true"
        run: npm run build

      - name: Run the suites
        working-directory: frontend
        env:
          CI: "true"
          E2E_API_URL: http://127.0.0.1:8100
        run: npx playwright test --project=chromium

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Audit Python dependencies
        working-directory: backend
        run: |
          pip install pip-audit
          pip-audit --desc || true
        continue-on-error: true

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Audit npm dependencies
        working-directory: frontend
        run: npm audit --audit-level=high || true
        continue-on-error: true

      - name: Check for committed secrets
        run: |
          # A development sentinel in .env.example is fine; a real key is not.
          if grep -rIn --exclude-dir=.git --exclude-dir=node_modules \
               -E "sk-ant-[A-Za-z0-9_-]{20,}|AKIA[0-9A-Z]{16}" .; then
            echo "::error::A credential appears to be committed."
            exit 1
          fi
          echo "No credentials found."

  docker:
    name: Docker images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3

      - name: Build the API image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: false
          load: true
          tags: starcode-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build the web image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: false
          load: true
          tags: starcode-web:ci
          build-args: |
            NEXT_PUBLIC_API_URL=http://localhost:8000
            NEXT_PUBLIC_ALLOW_LOCALHOST=true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: The API image must boot and answer
        run: |
          docker run -d --name api-smoke \
            -e DATABASE_URL="sqlite:////tmp/smoke.db" \
            -e ENVIRONMENT=development \
            -e AI_PROVIDER=offline \
            -e SEED_ON_START=false \
            -p 8000:8000 \
            starcode-api:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8000/api/v1/health/live && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:8000/api/v1/health/live
          docker logs api-smoke
          docker rm -f api-smoke
