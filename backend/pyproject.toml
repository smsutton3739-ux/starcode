[project]
name = "starcode-backend"
version = "1.0.0"
description = "Starcode — AI-powered analysis of ancient texts, historical documents and astronomical references"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    # The [email] extra is not optional here: `EmailStr` in app/schemas/user.py imports
    # email-validator at class-definition time, so without it the app does not fail when
    # someone submits a bad address — it fails at import, before serving anything. A
    # machine with email-validator already present for unrelated reasons hides this
    # completely, which is how it reached a deploy.
    "pydantic[email]>=2.9.0,<3",
    "email-validator>=2.2.0,<3",
    "pydantic-settings>=2.6.0",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14.0",
    "psycopg[binary]>=3.2.0",
    "pgvector>=0.3.6",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.17",
    "httpx>=0.27.0",
    "authlib>=1.3.2",
    "itsdangerous>=2.2.0",
    "redis>=5.2.0",
    "anthropic>=0.40.0",
    "pypdf>=5.1.0",
    # Rasterises scanned PDFs so they can be OCR'd. The runtime image already installs
    # poppler-utils, which exists for nothing else, so leaving this undeclared meant
    # shipping the system half of the feature without the Python half — and the import is
    # guarded, so it degraded silently rather than announcing itself.
    "pdf2image>=1.17.0,<2",
    "python-docx>=1.1.2",
    "pillow>=11.0.0",
    "pytesseract>=0.3.13",
    "selectolax>=0.3.21",
    "reportlab>=4.2.5",
    "structlog>=24.4.0",
    "tenacity>=9.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "C4"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # FastAPI's Depends() in defaults is the documented idiom
    "S101",   # assert is how tests assert
    # Enums deliberately inherit from `str` rather than using StrEnum: SQLAlchemy's
    # Enum(native_enum=False) and Pydantic both rely on the member being a real str,
    # and StrEnum changes __str__ in a way that would alter existing log output.
    "UP042",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S", "B"]
"app/knowledge/corpus.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
